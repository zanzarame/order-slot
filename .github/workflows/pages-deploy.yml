name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'delete' ||
      (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/v'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble verified Pages artifact
        run: node scripts/build-pages-site.mjs --staging "${{ runner.temp }}/pages-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deleted preview and unchanged production
        if: github.event_name == 'delete'
        env:
          DELETED_REF: ${{ github.event.ref }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/verify-pages-cleanup.mjs
