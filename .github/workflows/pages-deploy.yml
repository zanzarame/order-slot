name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  delete:
  workflow_dispatch:

permissions:
  contents: read

# This workflow can publish Pages, so external Actions are pinned to immutable full commit SHAs.
# Weekly Dependabot updates in .github/dependabot.yml surface newer trusted revisions for review.

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'delete' ||
      (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/v'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out production
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Assemble verified Pages artifact
        run: node scripts/build-pages-site.mjs --staging "${{ runner.temp }}/pages-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify deleted preview and unchanged production
        if: github.event_name == 'delete'
        env:
          DELETED_REF: ${{ github.event.ref }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/verify-pages-cleanup.mjs
